# Gitleaks configuration: the default rules, plus one deliberate exception.
#
# contract/workspace-v1.json holds identity tokens signed with a fixed,
# published, test-only key (`identityToken.vectorKey`). They are known-answer
# test vectors, not credentials: the key signs these vectors and nothing else.

[extend]
useDefault = true

[allowlist]
description = "Test-only contract vectors"
paths = ['''^contract/workspace-v1\.json$''']
